# Copyright (c) 2026 Pluimvee
# Nexus Control - Solis S6-EH3P battery EMS controller via Modbus TCP

substitutions:
  device_id: nexus-control
  build_root: !secret build_root
  friendly_name: Nexus Control
  # Accucapaciteit volgens spec. Vaste waarde (geen HA-input meer): hij komt overeen met
  # de remaining kWh en SOC die de BMS zelf rapporteert, en verandert niet.
  battery_capacity_kwh: "20.48"
  # Eindpunten waarboven/-onder de coulomb-telling uitgaat en de BMS autoritatief is.
  # Gebruikt in battery_soc (ankering) én battery_soc_hires (berekening) — één plek,
  # zodat die twee niet uit elkaar kunnen lopen.
  # Boven: herijking alleen bij BMS 100; daaronder telt hires tot TOP - 0,1 = 99,9, zodat een
  # BMS-stilstand bovenin (15-10: 95% gedurende 77 min) niet op 98,9 vastloopt. Een doel van
  # 100 blijft daardoor alleen haalbaar via een BMS-melding van 100 (les van 05-09).
  hires_top_pct: "100"
  hires_floor_pct: "7"
  # hires v3 (PBI-044, 28-10-2026): tellen in ampère i.p.v. watt. Capaciteit en laadfactor
  # gefit op drie ijkpuntparen 15-10..22-10 (Solis P/V tegen BMS 7/100, rms 0,06pp) —
  # opnieuw toetsen zodra er meer ijkpunten zijn.
  hires_ah: "50.5"
  hires_chg_factor: "1.013"
  # Energie (pp) sinds de laatste BMS-stap waarboven we een BMS-stilstand aannemen. Een
  # normale stap is ~1pp; de BMS blijft op vaste plekken hangen (89-90 bij laden, 19-21
  # bij ontladen). Sinds v3 alleen nog diagnose (bms_stalled), geen invloed op hires.
  hires_stall_pp: "1.5"
  # Diagnosevlag als hires meer dan dit (pp) van de BMS afwijkt; er wordt niet gecorrigeerd.
  hires_deviation_pp: "10"
  # Opdrachtvenster (s): elke opdracht geldt zo lang vanaf het schrijven; daarna safe mode
  # (level, target_grid 0). Gelijk aan de kwartier-cadans van de EMS-strategie (PBI-046).
  command_window_s: "900"

packages:
  wifi: !include ../wifi.yaml
  version: !include ../version.yaml

esphome:
  name: ${device_id}
  build_path: ${build_root}/${device_id}
  friendly_name: ${friendly_name}
  project:
    name: 'EcoGrid.Nexus Control'
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0
  logs:
    sensor: WARN
    modbus_controller.sensor: WARN
    modbus_controller: ERROR

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

mdns:
  disabled: false

web_server:
  port: 80
  version: 3

uart:
  - id: uart_rs485
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

modbus:
  - id: rs485
    uart_id: uart_rs485

modbus_controller:
  - id: solis
    address: 1
    modbus_id: rs485
    update_interval: 1s
    setup_priority: -10
    command_throttle: 750ms

globals:
  # Einde van het opdrachtvenster (millis); 0 = geen venster (safe mode). Zie arm_command.
  # (millis() + 900s is eens per ~49,7 dagen precies 0: dan geldt die ene ms als safe mode.)
  - id: cmd_deadline_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Laadt de Solis nu via RC Force Charge (43135/43136) i.p.v. RC Grid Adjustment? Zie apply_mode.
  - id: g_force_charge
    type: bool
    restore_value: false
    initial_value: 'false'


  # battery_soc_hires (zie aldaar): ampère-telling (P/V) die alleen bij de BMS-eindpunten
  # (100, <= 7) herijkt wordt. g_hires is de stand zelf (pp).
  - id: g_hires
    type: float
    restore_value: false
    initial_value: '0.0'
  # hires − BMS (pp) op het moment van de laatste BMS-stap. Alleen om hires over een
  # herstart te bewaren (hires = BMS + g_off bij de eerste melding); geen correctie meer.
  # Wijzigt alleen bij BMS-stappen, dus weinig flash-slijtage (ESPHome schrijft alleen bij
  # een echte wijziging).
  - id: g_off
    type: float
    restore_value: true
    initial_value: '0.0'
  # Energie (pp, + = laden) sinds de laatste BMS-stap — voedt de diagnose bms_stalled.
  - id: g_e_step
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_batt_energy_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # De laatst bevestigde, echte BMS-waarde (hele procenten); -1 = nog geen melding.
  - id: g_batt_soc_last_raw
    type: float
    restore_value: false
    initial_value: '-1.0'

  # Memoized base_energy (kWh) — bijgewerkt via on_value van overdischarge_soc_mirror
  # (33213), losgekoppeld van de publicatie-cadans van de base_energy-sensor zelf.
  #
  # restore_value omdat 33213 maar elke 15 min gelezen wordt: zonder bewaren stond
  # base_energy na elke (her)start tot een kwartier op 0, en was usable_energy in dat
  # venster gelijk aan remaining_energy. Slijtage is geen punt — ESPHome schrijft alleen
  # weg als de waarde daadwerkelijk verandert (memcmp in RestoringGlobalsComponent), en
  # deze verandert vrijwel nooit. De 0.0 hieronder geldt dus alleen nog bij de allereerste
  # start, vóór er ooit een waarde is bewaard.
  - id: g_base_energy_kwh
    type: float
    restore_value: true
    initial_value: '0.0'

  # Grid metrics tumbling-window globals (15 min, reset after publish)
  - id: g_grid_sum
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_grid_min
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_grid_max
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_grid_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_grid_crossings
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_grid_prev_zone
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_grid_median_buf
    type: std::vector<float>
    restore_value: false
  # Histogram buckets (delta = grid − target): <-500 | -500:-100 | -100:-50 | -50:-20 | -20:20 | 20:50 | 50:100 | 100:500 | >500
  - id: g_hist_0
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_1
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_2
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_3
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_4
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_5
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_6
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_7
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_hist_8
    type: int
    restore_value: false
    initial_value: '0'

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    icon: "mdi:wifi"
    update_interval: 60s

  # Accuspanning (0,1V) voor de ampère-telling in battery_power_raw (I = P/V). P/V geeft
  # dezelfde ampères als 33134 maar met 1W- i.p.v. ~41W-resolutie (PBI-044).
  # register_count 2 sluit aan op 33135: het hoofdblok wordt 33133-33152 in één FC04.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_voltage_raw
    internal: true
    register_type: read
    address: 33133
    value_type: U_WORD
    register_count: 2
    unit_of_measurement: "V"
    accuracy_decimals: 1
    skip_updates: 5
    filters:
      - multiply: 0.1

  # Laad/ontlaad-richting, apart van 33149's magnitude: bleek in de praktijk nodig — 33149
  # levert géén betrouwbaar teken (altijd positieve magnitude, ongeacht richting), ondanks
  # dat de spec het als signed S32 documenteert. 0 = charge, 1 = discharge.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_direction_raw
    internal: true
    register_type: read
    address: 33135
    value_type: U_WORD
    # ESPHome voegt alleen exact aansluitende registers samen tot één request. register_count
    # leest de tussenliggende registers mee, zodat 33135-33152 één FC04 is (i.p.v. vier).
    register_count: 4
    accuracy_decimals: 0
    skip_updates: 5

  # Reading the register block 33135-33152 as one FC04 every 5s
  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_soc
    name: "Battery SOC"
    icon: "mdi:battery-medium"
    register_type: read
    address: 33139
    value_type: U_WORD
    # 33139-33148: overbrugt het gat naar 33149 (33147 huislast is onbruikbaar, zie residual_power)
    register_count: 10
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    skip_updates: 5
    on_value:
      then:
        # BMS ververst SOC onregelmatig (pas bij een echte 1%-sprong); on_value vuurt
        # vaker met dezelfde waarde. Alleen bij een echte wijziging handelen we een stap af.
        #
        # v3 (PBI-044, 28-10-2026): tussen de eindpunten volgt hires de BMS niet meer. De
        # band rond BMS + offset kostte meer dan hij opleverde (22-10: 4,8pp kwijt bij snel
        # laden en offsetcorrecties); de ampère-telling klopt op ±0,3pp per cyclus. Alleen
        # bij 100 en <= 7 herijkt de BMS.
        - lambda: |-
            if (id(g_batt_soc_last_raw) != x) {
              const float TOP = ${hires_top_pct}.0f, FLOOR = ${hires_floor_pct}.0f;
              float prev = id(g_batt_soc_last_raw);
              float h = id(g_hires);
              bool endpoint = (x >= TOP || x <= FLOOR);

              if (endpoint) {
                // Herijking: BMS is autoritatief.
                h = x;
              } else if (prev < 0.0f) {
                // Eerste melding na opstart: g_off (hires − BMS bij de laatste stap) is bewaard.
                h = x + id(g_off);
              } else if (prev >= TOP || prev <= FLOOR) {
                // Weg van een eindpunt (100→99, 7→8): op het eindpunt telde hires niet,
                // dus midden in de nieuwe stap beginnen.
                h = (x > prev) ? x - 0.5f : x + 0.5f;
              }
              // Anders: gewone BMS-stap, hires blijft staan.

              // 100 en 7 alleen via de BMS zelf — maar niet na een herijking, anders
              // zou hires bij BMS 100 op 99,9 blijven staan.
              if (!endpoint) h = std::min(TOP - 0.1f, std::max(FLOOR + 0.1f, h));

              id(g_hires) = h;
              id(g_off) = h - x;
              id(g_e_step) = 0.0f;
              id(g_batt_soc_last_raw) = x;
            }

  # S32 register (33149+33150), unit W — in de praktijk een magnitude zonder betrouwbaar
  # teken (zie battery_direction_raw hierboven); richting wordt daar expliciet uit gehaald.
  # Voedt de coulomb-counting hierboven — batcht gratis mee in hetzelfde FC04-blok.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_power_raw
    internal: true
    register_type: read
    address: 33149
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    skip_updates: 5
    on_value:
      then:
        - lambda: |-
            uint32_t now = millis();
            if (id(g_batt_energy_last_ms) != 0 && id(g_batt_soc_last_raw) >= 0.0f) {
              const float TOP = ${hires_top_pct}.0f, FLOOR = ${hires_floor_pct}.0f;
              const float AH = ${hires_ah}f;
              float dt_h = (now - id(g_batt_energy_last_ms)) / 3600000.0f;
              // Tellen in ampère (PBI-044): de spanning ligt bij laden hoger (tot 439V) dan bij
              // ontladen (tot 394V), dus een vaste Wh/pp telde laden te zwaar. Zonder geldige
              // spanning de nominale (capaciteit/Ah).
              float v = id(battery_voltage_raw).state;
              if (std::isnan(v) || v < 300.0f) v = ${battery_capacity_kwh} * 1000.0f / AH;
              // 33149 levert alleen betrouwbaar de magnitude; richting komt uit 33135
              // (0=charge, 1=discharge) — zie battery_direction_raw. Laden × laadfactor:
              // de Solis weegt ontladen ~1,3% zwaarder dan de BMS-shunt.
              float i = fabsf(x) / v;
              if (id(battery_direction_raw).has_state() && id(battery_direction_raw).state >= 0.5f) {
                i = -i;  // discharge
              } else {
                i *= ${hires_chg_factor}f;
              }
              float dh = i * dt_h / AH * 100.0f;  // pp
              id(g_e_step) += dh;

              float bms = id(g_batt_soc_last_raw);
              if (bms >= TOP || bms <= FLOOR) {
                id(g_hires) = bms;
              } else {
                id(g_hires) = std::min(TOP - 0.1f, std::max(FLOOR + 0.1f, id(g_hires) + dh));
              }
            }
            id(g_batt_energy_last_ms) = now;

  # S32 register (33151+33152), unit W; + = discharge, - = charge
  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_port_power
    name: "Inverter Power"
    icon: "mdi:lightning-bolt-circle"
    register_type: read
    address: 33151
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    skip_updates: 5
    on_value:
      then:
        - text_sensor.template.publish:
            id: controller_mode_sensor
            state: !lambda |-
              if (x > 150.0f) return std::string("discharging");
              if (x < -150.0f) return std::string("charging");
              return std::string("standby");

  # Internal 1Hz grid meter reader — accumulates metrics, does NOT publish raw to HA recorder
  # HA-visible throttled copy is the meter_power template sensor below
  - platform: modbus_controller
    modbus_controller_id: solis
    id: meter_power_raw
    internal: true
    register_type: read
    address: 33263
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    skip_updates: 1
    # Solis convention (export +, import -) → house convention (import +, export -)
    filters:
      - multiply: -1.0
    on_value:
      then:
        - lambda: |-
            float v = x;

            // Min / max / sum / count
            if (id(g_grid_count) == 0) {
              id(g_grid_min) = v;
              id(g_grid_max) = v;
            } else {
              if (v < id(g_grid_min)) id(g_grid_min) = v;
              if (v > id(g_grid_max)) id(g_grid_max) = v;
            }
            id(g_grid_sum) = id(g_grid_sum) + v;
            id(g_grid_count) = id(g_grid_count) + 1;

            // Buffer raw value for median (sorted at publish time)
            id(g_grid_median_buf).push_back(v);

            // Histogram: 9 buckets on delta = grid − target, boundaries at ±20/50/100/500 W
            float tgt = id(target_grid_number).has_state() ? id(target_grid_number).state : 0.0f;
            float d = v - tgt;
            if      (d <  -500.0f) id(g_hist_0) = id(g_hist_0) + 1;
            else if (d <  -100.0f) id(g_hist_1) = id(g_hist_1) + 1;
            else if (d <   -50.0f) id(g_hist_2) = id(g_hist_2) + 1;
            else if (d <   -20.0f) id(g_hist_3) = id(g_hist_3) + 1;
            else if (d <=   20.0f) id(g_hist_4) = id(g_hist_4) + 1;
            else if (d <=   50.0f) id(g_hist_5) = id(g_hist_5) + 1;
            else if (d <=  100.0f) id(g_hist_6) = id(g_hist_6) + 1;
            else if (d <=  500.0f) id(g_hist_7) = id(g_hist_7) + 1;
            else                   id(g_hist_8) = id(g_hist_8) + 1;

            // Zero-crossing detection with ±20W dead-band
            // zone: -1=export, 0=dead-band, 1=import; crossing only on import↔export flip
            int zone = (v > 20.0f) ? 1 : (v < -20.0f ? -1 : 0);
            int prev = id(g_grid_prev_zone);
            if (prev != 0 && zone != 0 && zone != prev) {
              id(g_grid_crossings) = id(g_grid_crossings) + 1;
            }
            if (zone != 0) id(g_grid_prev_zone) = zone;

  # Grid Power — HA-visible, 5s update; drives grid_status text sensor
  - platform: template
    id: meter_power
    name: "Grid Power"
    icon: "mdi:meter-electric"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(meter_power_raw).state;
    on_value:
      then:
        - text_sensor.template.publish:
            id: grid_status_sensor
            state: !lambda |-
              if (x > 50.0f) return std::string("import");
              if (x < -50.0f) return std::string("export");
              return std::string("level");

  # Command Timer — resterende seconden van het opdrachtvenster; 0 = safe mode. Het bestaan
  # van deze sensor vertelt de EMS-strategie dat de firmware kwartier-opdrachten verwacht.
  - platform: template
    id: command_timer
    name: "Command Timer"
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      uint32_t d = id(cmd_deadline_ms);
      if (d == 0) return 0.0f;
      int32_t left = (int32_t)(d - millis());
      return left > 0 ? left / 1000.0f : 0.0f;

  # Residual Power — alles achter de meter behalve de accu: huisverbruik minus Omnik-PV,
  # dus negatief bij PV-overschot. = grid (+ = import) − accu-DC (+ = laden).
  # PBI-012 (user 28-10-2026): met het DC-vermogen (33149, teken uit 33135) i.p.v. de
  # AC-poort (33151) telt het omvormerverlies (omzetting + stand-by) als huislast; de
  # integraal sluit daarmee aan op residual_energy, en in apply_mode krijgt de accu bij
  # setpoint = residual + R netto R aan de DC-kant.
  # Vervangt house_load (33147): dat register is U16 en blijft op 0 bij PV-overschot.
  - platform: template
    id: residual_power
    name: "Residual Power"
    icon: "mdi:home-lightning-bolt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (std::isnan(id(meter_power_raw).state) || std::isnan(id(battery_power_raw).state) ||
          !id(battery_direction_raw).has_state()) return NAN;
      float b = fabsf(id(battery_power_raw).state);  // magnitude; richting uit 33135 (1 = discharge)
      return id(meter_power_raw).state + (id(battery_direction_raw).state >= 0.5f ? b : -b);

  # Hoger-resolutie SOC-schatting (v3, 28-10-2026, PBI-044). Ampère-telling op P/V
  # (33149/33133) die tussen de eindpunten los van de BMS loopt. De state wordt bijgewerkt
  # in battery_power_raw en battery_soc on_value; deze sensor publiceert alleen.
  # apply_mode gebruikt 'm als soc-bron; remaining_energy/usable_energy zijn hiervan afgeleid.
  #
  # Waarom los van de BMS: de BMS (Pylontech Force H3, fw 0.1.0.5) blijft op vaste plekken
  # hangen — bij laden op 89-90%, bij ontladen rond 19-21% — soms uren, en telt daarna door
  # vanaf de foute stand. Tussen de eindpunten heeft hij dus geen betere informatie dan de
  # telling. Zie nexus_control.md voor de analyse.
  #
  # Bij de eindpunten (100, <= 7) is de BMS autoritatief: daar herijkt hij zelf, en
  # hires kan 100 alleen aanwijzen als de BMS dat zelf meldt (daaronder max 99,9).
  - platform: template
    id: battery_soc_hires
    name: "Battery SOC HiRes"
    icon: "mdi:battery-charging-high"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(g_batt_soc_last_raw) < 0.0f) return NAN;
      return id(g_hires);

  # Diagnose: hires − BMS (pp), live. Sinds v3 geen correctiegrootheid meer.
  - platform: template
    id: battery_soc_offset
    name: "Battery SOC Offset"
    icon: "mdi:battery-sync"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(g_batt_soc_last_raw) < 0.0f) return NAN;
      return id(g_hires) - id(g_batt_soc_last_raw);

  # Netstroom per fase (op de "Grid"-locatie geconfigureerde meter, zie meter_type_cfg=0x0105).
  # Stap 1 richting dynamische per-fase-limiet (zie TODO in apply_mode): eerst alleen
  # uitlezen/observeren, nog niet in de sturing verwerkt.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_current_a
    name: "Grid Current Phase A"
    icon: "mdi:current-ac"
    register_type: read
    address: 33252
    value_type: U_WORD
    register_count: 2   # aansluitend t/m 33256: één request i.p.v. drie
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    skip_updates: 10
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_current_b
    name: "Grid Current Phase B"
    icon: "mdi:current-ac"
    register_type: read
    address: 33254
    value_type: U_WORD
    register_count: 2
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    skip_updates: 10
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_current_c
    name: "Grid Current Phase C"
    icon: "mdi:current-ac"
    register_type: read
    address: 33256
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    skip_updates: 10
    filters:
      - multiply: 0.01
    # Tijdens force charge begrenst de Solis het net niet zelf: een fase boven I_LIM_A (25A,
    # zie apply_mode) direct bijsturen i.p.v. tot 30s te wachten (PBI-058). C is de laatste
    # in de request, dus A en B zijn dan al ververst.
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(g_force_charge) &&
                       std::max(x, std::max(id(grid_current_a).state, id(grid_current_b).state)) > 25.0f;
            then:
              - script.execute: apply_mode

  # Energietellers voor residual_energy — lage prioriteit, elke 60s (skip_updates 59).
  # Accu: Solis-tellers 33161/33165 (U32, 0,01 kWh — gecontroleerd tegen de HA-integratie).
  # Meten niet exact op de AC-poort (iets boven de BMS-DC-teller), zie nexus_control.md.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_charge_total
    internal: true
    register_type: read
    address: 33161
    value_type: U_DWORD
    register_count: 4   # t/m 33164, aansluitend op 33165: één request
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    skip_updates: 59
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: solis
    id: battery_discharge_total
    internal: true
    register_type: read
    address: 33165
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    skip_updates: 59
    filters:
      - multiply: 0.01

  # Net: tellers van de SDM630 via de Solis (U32, 0,01 kWh).
  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_import_total
    internal: true
    register_type: read
    address: 33283
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    skip_updates: 59
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: solis
    id: grid_export_total
    internal: true
    register_type: read
    address: 33285
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    skip_updates: 59
    filters:
      - multiply: 0.01

  # Residual Energy — tweezijdige teller bij residual_power: import − export + ontladen −
  # laden. Daalt bij PV-overschot, dus state_class total (niet total_increasing).
  - platform: template
    id: residual_energy
    name: "Residual Energy"
    icon: "mdi:home-lightning-bolt-outline"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (!id(grid_import_total).has_state() || !id(grid_export_total).has_state() ||
          !id(battery_charge_total).has_state() || !id(battery_discharge_total).has_state()) return NAN;
      return id(grid_import_total).state - id(grid_export_total).state
           + id(battery_discharge_total).state - id(battery_charge_total).state;

  # Overdischarge SOC mirror — de MIRROR (33213), niet de instelling (43011): de mirror is
  # wat de omvormer werkelijk toepast als ondergrens, de instelling kan afwijken/vertragen.
  # Verandert in de praktijk vrijwel nooit, dus bewust laagfrequent: skip_updates 900
  # @ 1s update_interval = elke 15 minuten.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: overdischarge_soc_mirror
    internal: true
    register_type: read
    address: 33213
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    skip_updates: 900
    on_value:
      then:
        - lambda: |-
            id(g_base_energy_kwh) = ${battery_capacity_kwh} * x / 100.0f;

  # Accucapaciteit volgens spec — vaste waarde uit de substitutions, alleen gepubliceerd
  # zodat HA/AppDaemon de aanname kan zien. Geen input meer: hij komt overeen met de
  # remaining kWh en SOC die de BMS zelf rapporteert.
  - platform: template
    id: battery_capacity
    name: "Battery Capacity"
    icon: "mdi:battery-high"
    device_class: energy_storage
    state_class: measurement
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 300s
    lambda: return ${battery_capacity_kwh};

  # base_energy: het deel van de accu-inhoud onder de overdischarge-ondergrens — niet
  # bruikbaar energiebudget. Herberekend via on_value van overdischarge_soc_mirror
  # (zie hierboven) in g_base_energy_kwh ("static mem"); deze sensor publiceert alleen,
  # met een delta-filter omdat de waarde vrijwel nooit verandert.
  - platform: template
    id: base_energy
    name: "Base Energy"
    icon: "mdi:battery-alert-variant-outline"
    device_class: energy_storage
    state_class: measurement
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - delta: 0.0005
    lambda: return id(g_base_energy_kwh);

  # remaining_energy: totale accu-inhoud in kWh, afgeleid van battery_soc_hires (niet
  # rechtstreeks van de onderliggende globals) zodat de ±0,5pp-band daarop automatisch
  # meekomt — zie Hoge-resolutie SOC in nexus_control.md.
  - platform: template
    id: remaining_energy
    name: "Remaining Energy"
    icon: "mdi:battery-charging-100"
    device_class: energy_storage
    state_class: measurement
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(battery_soc_hires).state)) return NAN;
      return id(battery_soc_hires).state / 100.0f * ${battery_capacity_kwh};

  # usable_energy: remaining_energy minus het niet-bruikbare deel onder de
  # overdischarge-ondergrens (base_energy).
  - platform: template
    id: usable_energy
    name: "Usable Energy"
    icon: "mdi:battery-heart-variant"
    device_class: energy_storage
    state_class: measurement
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(remaining_energy).state) || !id(base_energy).has_state()) return NAN;
      return id(remaining_energy).state - id(base_energy).state;

  # target_usable: het SOC-doel (charge/discharge) uitgedrukt in kWh boven de overdischarge-
  # ondergrens, rechtstreeks vergelijkbaar met usable_energy. Vervangt niet target_soc zelf
  # (dat blijft de HA-facing %-waarde) — apply_mode kan dit intern gebruiken i.p.v. losse
  # %-rekenwerk in de SOC-gap-logica.
  - platform: template
    id: target_usable
    name: "Target Usable Energy"
    icon: "mdi:battery-arrow-up-outline"
    device_class: energy_storage
    state_class: measurement
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(overdischarge_soc_mirror).has_state()) return NAN;
      return ${battery_capacity_kwh} * (id(target_soc_number).state - id(overdischarge_soc_mirror).state) / 100.0f;

  # Grid metrics — published every 15 min by publish_grid_metrics script
  - platform: template
    id: grid_metric_min_w
    name: "Grid Metric Min"
    icon: "mdi:arrow-collapse-down"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: grid_metric_max_w
    name: "Grid Metric Max"
    icon: "mdi:arrow-collapse-up"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: grid_metric_mean_w
    name: "Grid Metric Mean"
    icon: "mdi:approximately-equal"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: grid_metric_median_w
    name: "Grid Metric Median"
    icon: "mdi:approximately-equal-box"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: grid_metric_samples
    name: "Grid Metric Samples"
    icon: "mdi:counter"
    unit_of_measurement: ""
    state_class: total
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: grid_metric_crossings
    name: "Grid Metric Crossings"
    icon: "mdi:transfer"
    unit_of_measurement: ""
    state_class: total
    accuracy_decimals: 0
    update_interval: never

# ── HA interface  ─────────────────────────────────────────────────────
select:
  - platform: template
    id: ems_mode_select
    name: "Control Mode"
    icon: "mdi:battery-clock"
    options:
      - "hold"
      - "level"
      - "charge"
      - "discharge"
    optimistic: true
    # Na een (her)start altijd safe mode (level, target_grid 0): een opdracht van vóór de
    # herstart is niet meer geldig, de strategie schrijft binnen het kwartier een nieuwe.
    restore_value: false
    initial_option: "level"
    on_value:
      then:
        - script.execute: arm_command
        - script.execute: apply_mode

binary_sensor:
  # Diagnose: aan zolang de BMS stilstaat (meer energie sinds de laatste stap dan
  # hires_stall_pp). Sinds v3 zonder invloed op hires.
  - platform: template
    id: bms_stalled
    name: "BMS Stalled"
    icon: "mdi:battery-alert"
    lambda: |-
      return id(g_batt_soc_last_raw) >= ${hires_floor_pct}.0f + 1.0f
          && id(g_batt_soc_last_raw) <= ${hires_top_pct}.0f - 1.0f
          && fabsf(id(g_e_step)) > ${hires_stall_pp}f;

  # Diagnose (PBI-044): hires wijkt meer dan hires_deviation_pp van de BMS af. Er wordt niet
  # gecorrigeerd; een aanhoudende vlag wijst op een fout in de telling of de BMS.
  - platform: template
    id: hires_deviation
    name: "SOC HiRes Deviation"
    icon: "mdi:battery-unknown"
    lambda: |-
      return id(g_batt_soc_last_raw) >= 0.0f
          && fabsf(id(g_hires) - id(g_batt_soc_last_raw)) > ${hires_deviation_pp}.0f;

text_sensor:
  - platform: template
    id: controller_mode_sensor
    name: "Inverter Status"
    icon: "mdi:state-machine"
    update_interval: never

  - platform: template
    id: grid_status_sensor
    name: "Grid Status"
    icon: "mdi:transmission-tower-export"
    update_interval: never

  - platform: template
    id: grid_metric_histogram
    name: "Grid Metric Histogram"
    icon: "mdi:chart-bar"
    update_interval: never

number:
  # ── HA interface numbers ─────────────────────────────────────────────────────
  - platform: template
    id: target_grid_number
    name: "Target Grid Power"
    icon: "mdi:tune-vertical"
    unit_of_measurement: "W"
    device_class: power
    min_value: -10000
    max_value: 10000
    step: 100
    mode: box
    optimistic: true
    restore_value: false   # na een (her)start: safe mode, zie control_mode
    initial_value: 0
    on_value:
      then:
        - script.execute: arm_command
        - script.execute: apply_mode

  - platform: template
    id: target_soc_number
    name: "Target SOC"
    icon: "mdi:battery-arrow-up"
    unit_of_measurement: "%"
    min_value: 7
    max_value: 100
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 80
    on_value:
      then:
        - script.execute: arm_command
        - script.execute: apply_mode

  # ── Modbus holding registers ─────────────────────────────────────────────────
  # Waarom number en niet output of sensor?
  #   - sensor: read-only, kan niet schrijven
  #   - output: write-only float (0.0–1.0), niet bruikbaar voor ruwe register-integers
  #   - number: read+write, min/max/step voor integer waarden — enige optie
  #
  # Timing: make_call().set_value(val).perform() schrijft op het moment dat WIJ
  # perform() aanroepen (vanuit de 5s lambda), niet direct bij waardeverandering vanuit HA.
  # De timing is dus volledig in eigen beheer, net als de vroegere write_reg helper.
  #
  # Adresblokken (ESPHome batcht aangrenzende registers in één FC03 request):
  #   43029         → los request (gap van 81 t.o.v. 43110)
  #   43110..43140  → één request (span 31, bevat config + RC registers)
  #   43282         → los request

  # Config registers: read every 5 min to detect drift, write when value differs
  - platform: modbus_controller
    modbus_controller_id: solis
    id: ct_direction_cfg
    register_type: holding
    address: 43029
    value_type: U_WORD
    min_value: 0
    max_value: 1
    step: 1
    internal: true
    skip_updates: 300

  # Solis Inverter operating mode -
  # we use value 33 (0x0021) for self-use mode with grid feed-in allowed
    # BIT00 Self-Use Mode 0—OFF 1—ON
    # BIT01 Time of use mode 0—OFF 1—ON
    # BIT02 OFF-grid mode 0—OFF 1—ON
    # BIT03 Battery wakeup switch 0—OFF 1—ON
    # BIT04 Reserve battery mode 0—OFF 1—ON
    # BIT05 Allow grid to charge the battery 0—NotAllow / 1—Allow
    # BIT06 Feed in priority mode 0—OFF 1—ON
    # BIT07 Batt OVC Function 0—OFF 1—ON
    # BIT08 Battery Focecharge Peakshaving Function 0—OFF 1—ON
    # BIT09 Battery current correction enable switch 0—OFF 1—ON
    # BIT10 Battery healing mode 0—OFF 1—ON
    # BIT11 Peak-shaving mode 0—OFF 1—ON
  - platform: modbus_controller
    modbus_controller_id: solis
    id: storage_control_switch
    register_type: holding
    address: 43110
    value_type: U_WORD
    min_value: 0
    max_value: 65535
    step: 1
    internal: true
    skip_updates: 300

  # RC operation registers: written by control loop via perform(), read infrequently (skip_updates=3600)
  # output zou semantisch beter passen (write-only) maar ondersteunt geen raw integer waarden
  - platform: modbus_controller
    modbus_controller_id: solis
    id: rc_charge_power_reg
    register_type: holding
    address: 43136
    value_type: U_WORD
    min_value: 0
    max_value: 1000
    step: 1
    internal: true
    skip_updates: 3600

  - platform: modbus_controller
    modbus_controller_id: solis
    id: rc_force_mode_reg
    register_type: holding
    address: 43135
    value_type: U_WORD
    min_value: 0
    max_value: 3
    step: 1
    internal: true
    skip_updates: 3600

  # RC Grid Adjustment ON/OFF — geschreven door apply_mode, zie RC_THRESHOLD_W-logica daar.
  # Debug-zichtbaarheid (name + skip_updates:10) is verwijderd na afronding van de RC-timeout-
  # lapse-test; weer internal + trage cadans zoals de overige RC-registers.
  - platform: modbus_controller
    modbus_controller_id: solis
    id: rc_grid_adj_reg
    register_type: holding
    address: 43132
    value_type: U_WORD
    min_value: 0
    max_value: 1
    step: 1
    internal: true
    skip_updates: 3600

  - platform: modbus_controller
    modbus_controller_id: solis
    id: rc_grid_power_reg
    register_type: holding
    address: 43133
    value_type: S_WORD
    # 43133 is een grid-target, geen omvormer-vermogen: de Solis probeert de gemeten grid-flow
    # naar dit setpoint te sturen door batterijvermogen bij te schakelen (grid = huislast − PV +
    # batterijvermogen), en dát batterijvermogen is wat door het omvormer-vermogen begrensd wordt.
    # 15kW aanvragen bleek in de praktijk niet gehaald te worden; 10kW pragmatisch als vaste
    # bovengrens, gelijk aan MAX_GRID_W in apply_mode.
    min_value: -1000
    max_value: 1000
    step: 1
    internal: true
    skip_updates: 3600

  - platform: modbus_controller
    modbus_controller_id: solis
    id: meter_type_cfg
    register_type: holding
    address: 43140
    value_type: U_WORD
    min_value: 0
    max_value: 65535
    step: 1
    internal: true
    skip_updates: 300

  - platform: modbus_controller
    modbus_controller_id: solis
    id: rc_timeout_reg
    register_type: holding
    address: 43282
    value_type: U_WORD
    min_value: 2
    max_value: 30
    step: 1
    internal: true
    skip_updates: 3600

interval:
  # Controleer de configuratieregisters elke 5 minuten en corrigeer indien nodig
  - interval: 5min
    then:
      - lambda: |-
          auto write_reg = [](esphome::number::Number *n, float val) {
            n->make_call().set_value(val).perform();
          };
          if (!id(meter_type_cfg).has_state() || (uint16_t)id(meter_type_cfg).state != 0x0105u) {
            ESP_LOGI("nexus", "Config: meter type → 0x0105");
            write_reg(id(meter_type_cfg), 0x0105);
          }
          if (!id(ct_direction_cfg).has_state() || (uint16_t)id(ct_direction_cfg).state != 1u) {
            ESP_LOGI("nexus", "Config: CT direction → Reversed");
            write_reg(id(ct_direction_cfg), 1);
          }
          if (!id(storage_control_switch).has_state() || (uint16_t)id(storage_control_switch).state != 33u) {
            ESP_LOGI("nexus", "Config: storage control → 33");
            write_reg(id(storage_control_switch), 33);
          }
          ESP_LOGI("nexus", "Config: RC timeout → 2 min");
          write_reg(id(rc_timeout_reg), 2);

  # apply_mode herberekent het setpoint (charge/discharge: SOC-gap/marge/deadline) én
  # herbevestigt zo nodig RC Grid Adjustment (43132) — zie het script zelf voor de
  # RC_THRESHOLD_W-logica die bepaalt of dat laatste gebeurt. 30s geeft ruime marge
  # (4×) tegen de RC-timeout (43282, momenteel 2 min — de minimumwaarde volgens spec),
  # dus geen apart keepalive-interval meer nodig.
  - interval: 30s
    then:
      - script.execute: apply_mode

  # Publiceer grid metrics en reset venster elke 15 minuten
  - interval: 15min
    then:
      - script.execute: publish_grid_metrics

script:
  # Opdrachtvenster (PBI-046, 22-10-2026): elke schrijfactie van control_mode, target_soc of
  # target_grid opent een venster van ${command_window_s}s vanaf nu — ook bij een ongewijzigde
  # waarde (on_value vuurt bij elke publish). De strategie herhaalt de opdracht elk kwartier.
  # Zelfde patroon als de auto-off in aqua-heatpump.yaml: mode restart + delay, elke opdracht
  # start de timer opnieuw. Na afloop zet arm_command alleen de Nexus-entiteiten op safe mode
  # (level, target_grid 0); apply_mode geeft daarop de Solis vrij naar self-use.
  # Safe mode zelf krijgt geen venster (cmd_deadline_ms = 0, geen delay): anders zou de terugval
  # via on_value zichzelf opnieuw armen en elke 15 min herhalen. cmd_deadline_ms is er voor de
  # resttijd in apply_mode en command_timer.
  - id: arm_command
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ems_mode_select).current_option() == "level" && id(target_grid_number).state == 0.0f;'
          then:
            lambda: 'id(cmd_deadline_ms) = 0;'
          else:
            - lambda: 'id(cmd_deadline_ms) = millis() + ${command_window_s}UL * 1000UL;'
            - delay: ${command_window_s}s
            # Eén lambda: de schrijfacties starten via on_value arm_command opnieuw (restart), en
            # dat annuleert de acties ná de lopende — binnen een lambda loopt alles door.
            # target_grid eerst stil op 0, zodat al de eerste on_value (van de mode) safe mode ziet:
            # geen nieuw venster en geen tussentijdse schrijfactie naar de Solis. De publish daarna
            # werkt HA bij; die on_value ziet ook safe mode en doet niets meer.
            - lambda: |-
                ESP_LOGW("nexus", "Command timer verlopen → returning to safe mode");
                id(target_grid_number).state = 0.0f;
                id(ems_mode_select).make_call().set_option("level").perform();
                id(target_grid_number).publish_state(0.0f);

  # Eén script voor alle modes. hold is de enige echte uitzondering (ander Solis-mechanisme,
  # Force Charge i.p.v. RC Grid Adjustment) en moet altijd onvoorwaardelijk herbevestigd
  # worden — self-use is precies wat hold wil vóórkomen. Voor level/charge/discharge wordt
  # het setpoint (43133) altijd geschreven (kost niets, en geeft direct effect zolang RC nog
  # actief is), maar RC Grid Adjustment (43132) alleen herbevestigd als de aanvraag groot
  # genoeg is om de moeite waard te zijn. Onder die drempel schrijven we 43132 niet — de Solis'
  # eigen RC-timeout (43282) laat 'm dan vanzelf verlopen naar self-use, zonder dat wij zelf
  # hoeven te bepalen wanneer dat "stabiel genoeg" is (dat is precies waar de oude level(0)-
  # speciale-geval-logica om vroeg was; die is nu overbodig, ditzelfde mechanisme dekt 'm mee).
  - id: apply_mode
    then:
      - lambda: |-
          auto write_reg = [](esphome::number::Number *n, float val) {
            n->make_call().set_value(val).perform();
          };
          std::string mode = id(ems_mode_select).current_option();

          if (mode == "hold") {
            id(g_force_charge) = false;
            write_reg(id(rc_charge_power_reg), 0);
            write_reg(id(rc_force_mode_reg), 1);
            ESP_LOGI("nexus", "Hold mode");
            return;
          }

          const float BATTERY_WH  = ${battery_capacity_kwh} * 1000.0f;
          // MAX_GRID_W: bovengrens op |setpoint| (de totale grid-aanvraag). Meer dan 10kW neemt
          // de Solis via 43133 niet aan; de aansluiting (3x25A) zou wel meer kunnen.
          const float MAX_GRID_W  = 10000.0f;
          // Fasegrens: de Solis verdeelt symmetrisch over de 3 fases, dus 1W extra setpoint is
          // 1/690 A per fase (3 x 230V). De ruimte bepaalt de zwaarste fase (garagegroep: EV-lader
          // + WP). Fasestroom ververst ~11s, de som draait elke 30s: een overschrijding duurt
          // hooguit één ronde, dat kan de 25A-zekering hebben.
          const float I_LIM_A     = 25.0f;
          const float W_PER_A     = 690.0f;
          // Ondergrens op de deler in de R-rekensom: één apply_mode-ronde. Met 2 min (tot 19-10)
          // deelde elke ronde in de laatste 2 min het restant opnieuw door "nog 2 min": het vermogen
          // zakte per ronde ~25% (9,0 → 7,2 → 5,4 → 4,2 → 3,1 kW) en het gat ging nooit dicht
          // (19-10 15:00: 81,7% tegen doel 82,3%).
          const uint32_t RATE_FLOOR_MS = 30000UL;
          const float RC_THRESHOLD_W = 100.0f;  // te kleine setpoints zijn RC-adjustment niet waard
          // Force charge (PBI-058): RC Grid Adjustment begrenst het net op 10kW, dus huislast gaat
          // daar van het laden af. Boven FORCE_ON_W (residual + R) laden via RC Force Charge
          // (43135/43136), terug onder FORCE_OFF_W (hysterese, user 28-10).
          const float FORCE_ON_W   = 8000.0f;
          const float FORCE_OFF_W  = 5000.0f;
          const float MAX_CHARGE_W = 10000.0f;  // omvormer; 43136 max 1000 x 10W
          // Niet ínstappen in force in de laatste 3 min van het venster (user 29-10): daar piekt R
          // door de 30s-vloer (need / resttijd) terwijl de accu bovenin weinig opneemt; 29-10
          // 01:59Z ging force zo 90s nodeloos aan. In force blijven mag wel (hysterese).
          const int32_t FORCE_ENTRY_CUTOFF_MS = 180000;

          float tgt_w      = id(target_grid_number).state;
          float tgt_soc    = id(target_soc_number).state;
          float adjusted_w = tgt_w;   // level (of hold, al geretourneerd) heeft geen extra-term
          float rate_w     = 0.0f;    // R: benodigd accuvermogen tot de deadline
          float res_w      = NAN;     // residual_power op het moment van rekenen
          float i_max      = NAN;     // zwaarste fase
          float phase_cap  = NAN;     // setpoint-grens door de fasestroom
          float soc        = -1.0f;
          bool  force      = false;   // deze ronde laden via RC Force Charge
          float force_w    = 0.0f;

          if (mode == "charge" || mode == "discharge") {
            // Hoger-resolutie SOC via battery_soc_hires i.p.v. de ruwe 1%-stappen van de BMS.
            // Valt terug op de ruwe SOC zolang er nog geen BMS-melding is geweest (net
            // opgestart — hires is dan NAN).
            if (!std::isnan(id(battery_soc_hires).state)) {
              soc = id(battery_soc_hires).state;
            } else if (id(battery_soc).has_state()) {
              soc = id(battery_soc).state;
            }

            // Opdracht = target_soc halen vóór het einde van het opdrachtvenster (15 min, PBI-046;
            // tot 22-10 het hele uur), met de waarden van nu. Geen PV-voorspelling en geen
            // buffer: PV die er nu is telt mee via
            // residual_power; verwachte PV en reserve zijn aan het EMS, dat target_soc zo vaak
            // kan bijstellen als het wil.
            //
            // Op het doel (need 0) blijft de huislast-term actief: de accu wordt vastgehouden en
            // het net levert huislast en EV (charge met target_soc = huidige SOC tijdens een
            // charge_deadline). Ligt de SOC al voorbij het doel (07-09: charge naar 17% vanaf
            // 54%), dan geldt gewoon tgt_w: de accu levert aan het huis tot het doel, en wordt
            // daar vastgehouden.
            bool not_past_target = (mode == "charge") ? (soc <= tgt_soc) : (soc >= tgt_soc);
            if (soc >= 0.5f && not_past_target) {
              float need_pct = (mode == "charge") ? (tgt_soc - soc) : (soc - tgt_soc);
              // Resttijd van het opdrachtvenster (verschil als int32: bestand tegen de
              // millis()-overloop na 49,7 dagen), met de vloer van één ronde.
              int32_t left_ms = (int32_t)(id(cmd_deadline_ms) - millis());
              float remaining = std::max(left_ms, (int32_t)RATE_FLOOR_MS) / 3600000.0f;
              rate_w = (need_pct / 100.0f) * BATTERY_WH / remaining;

              // Huislast-term: setpoint = residual ± R, zodat huislast (EV-lader, WP) het laden
              // niet wegdrukt. Binnen de 30s houdt de Solis het net op het setpoint: extra PV
              // gaat naar de accu (geen export), extra huislast wordt de volgende ronde
              // meegenomen. residual bevat de accu niet, dus geen terugkoppeling op zichzelf.
              res_w = id(residual_power).state;
              float res = std::isnan(res_w) ? 0.0f : res_w;
              float want_w = (mode == "charge") ? (res + rate_w) : (res - rate_w);

              // Fasegrens t.o.v. het huidige netvermogen (laden: import, ontladen: export).
              float grid_w = id(meter_power_raw).state;
              float cap_w = (mode == "charge") ? MAX_GRID_W : -MAX_GRID_W;
              if (id(grid_current_a).has_state() && id(grid_current_b).has_state() &&
                  id(grid_current_c).has_state() && !std::isnan(grid_w)) {
                i_max = std::max(id(grid_current_a).state,
                                 std::max(id(grid_current_b).state, id(grid_current_c).state));
                float headroom_w = W_PER_A * (I_LIM_A - i_max);
                phase_cap = (mode == "charge") ? (grid_w + headroom_w) : (grid_w - headroom_w);
                cap_w = (mode == "charge") ? std::min(cap_w, phase_cap) : std::max(cap_w, phase_cap);
              }

              // De grenzen duwen nooit voorbij tgt_w terug: laden blijft minstens tgt_w,
              // ontladen hooguit tgt_w (bij PV-overschot dus nooit export tijdens charge).
              if (mode == "charge")    adjusted_w = std::max(tgt_w, std::min(want_w, cap_w));
              if (mode == "discharge") adjusted_w = std::min(tgt_w, std::max(want_w, cap_w));

              // Force charge alleen met bekende fasestroom: de Solis begrenst het net dan niet
              // zelf, dus net = residual + laadvermogen moet onder phase_cap blijven. residual
              // bevat het laadvermogen niet (DC-zijde, PBI-012), dus geen terugkoppeling.
              if (mode == "charge" && !std::isnan(phase_cap)) {
                force = id(g_force_charge) ? (want_w >= FORCE_OFF_W)
                                           : (want_w > FORCE_ON_W && left_ms > FORCE_ENTRY_CUTOFF_MS);
                if (force) force_w = std::max(0.0f, std::min(rate_w, std::min(MAX_CHARGE_W, phase_cap - res)));
              }
            }
          }

          // Uit force charge: 43135 expliciet uit. 43132 = 1 zet force in de Solis ook uit, maar
          // onder RC_THRESHOLD_W wordt 43132 niet geschreven en liep force door tot de RC-timeout.
          if (id(g_force_charge) && !force) write_reg(id(rc_force_mode_reg), 0);
          id(g_force_charge) = force;

          if (force) {
            // Zoals hold: 43132/43133 niet aanraken (43132 = 1 zet force uit). Elke ronde
            // herschrijven houdt force binnen de RC-timeout (43282) levend.
            write_reg(id(rc_charge_power_reg), roundf(force_w / 10.0f));
            write_reg(id(rc_force_mode_reg), 1);
            ESP_LOGI("nexus", "charge FORCE P=%.0fW R=%.0fW res=%.0fW soc=%.1f%%/%.1f%% imax=%.1fA cap=%.0fW",
                      force_w, rate_w, res_w, soc, tgt_soc, i_max, phase_cap);
            return;
          }

          // 43133 convention is inverse of HA: positive = export, negative = import.
          // Altijd schrijven (ook bij een kleine/nul waarde) voor direct effect zolang RC nog
          // actief is — zie het bericht hierboven over waarom 43132 dat niet ook is.
          int16_t sp = -(int16_t)(adjusted_w / 10.0f);
          write_reg(id(rc_grid_power_reg), (float)sp);

          bool rc_on = fabsf(adjusted_w) > RC_THRESHOLD_W;
          if (rc_on) write_reg(id(rc_grid_adj_reg), 1);

          if (mode == "charge" || mode == "discharge") {
            ESP_LOGI("nexus", "%s tgt=%.0fW R=%.0fW res=%.0fW adj=%.0fW sp=%d soc=%.1f%%/%.1f%% imax=%.1fA cap=%.0fW rc=%s",
                      mode.c_str(), tgt_w, rate_w, res_w, adjusted_w, (int)sp, soc, tgt_soc, i_max,
                      phase_cap, rc_on ? "on" : "lapse");
          } else {
            ESP_LOGI("nexus", "%s tgt=%.0fW adj=%.0fW sp=%d rc=%s",
                      mode.c_str(), tgt_w, adjusted_w, (int)sp, rc_on ? "on" : "lapse");
          }

  - id: publish_grid_metrics
    then:
      - lambda: |-
          int n = id(g_grid_count);

          // Mean
          float mean_v = (n > 0) ? (id(g_grid_sum) / (float)n) : 0.0f;

          // Median: sort a copy of the buffer, take middle element
          float median_v = 0.0f;
          if (n > 0) {
            std::vector<float> sorted_buf = id(g_grid_median_buf);
            std::sort(sorted_buf.begin(), sorted_buf.end());
            int sz = (int)sorted_buf.size();
            median_v = (sz % 2 == 0)
              ? (sorted_buf[sz / 2 - 1] + sorted_buf[sz / 2]) / 2.0f
              : sorted_buf[sz / 2];
          }

          // Histogram JSON (bucket boundaries: ±100/300/500/1000 W)
          char hist[256];
          snprintf(hist, sizeof(hist),
            "{\"gt500\":%d,\"100:500\":%d,\"50:100\":%d,\"20:50\":%d,"
            "\"-20:20\":%d,\"-50:-20\":%d,\"-100:-50\":%d,\"-500:-100\":%d,\"lt-500\":%d}",
            id(g_hist_8), id(g_hist_7), id(g_hist_6), id(g_hist_5), id(g_hist_4),
            id(g_hist_3), id(g_hist_2), id(g_hist_1), id(g_hist_0));

          // Publish
          id(grid_metric_min_w).publish_state(n > 0 ? id(g_grid_min) : NAN);
          id(grid_metric_max_w).publish_state(n > 0 ? id(g_grid_max) : NAN);
          id(grid_metric_mean_w).publish_state(mean_v);
          id(grid_metric_median_w).publish_state(median_v);
          id(grid_metric_samples).publish_state((float)n);
          id(grid_metric_crossings).publish_state((float)id(g_grid_crossings));
          id(grid_metric_histogram).publish_state(std::string(hist));

          ESP_LOGI("nexus", "Grid metrics n=%d min=%.0f max=%.0f mean=%.1f median=%.1f cross=%d",
            n, (n > 0 ? id(g_grid_min) : 0.0f), (n > 0 ? id(g_grid_max) : 0.0f),
            mean_v, median_v, id(g_grid_crossings));

          // Reset window
          // Note: in ESPHOme there are no race conditions on globals, so we can safely reset them here without locking
          id(g_grid_sum) = 0.0f;
          id(g_grid_min) = 0.0f;
          id(g_grid_max) = 0.0f;
          id(g_grid_count) = 0;
          id(g_grid_crossings) = 0;
          id(g_grid_prev_zone) = 0;
          id(g_grid_median_buf).clear();
          id(g_hist_0) = 0; id(g_hist_1) = 0; id(g_hist_2) = 0;
          id(g_hist_3) = 0; id(g_hist_4) = 0; id(g_hist_5) = 0;
          id(g_hist_6) = 0; id(g_hist_7) = 0; id(g_hist_8) = 0;

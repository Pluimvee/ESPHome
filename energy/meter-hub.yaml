    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float a = id(phase_w)[6], b = id(phase_w)[7], c = id(phase_w)[8];
      if (isnan(a) || isnan(b) || isnan(c)) return NAN;

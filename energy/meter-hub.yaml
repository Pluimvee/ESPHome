# Copyright (c) 2026 Pluimvee
# Meter Hub - DSMR/P1 smart meter + SDM72D-M submeters on one ESP32-C3
#
# The point of putting both on one controller is timing. The P1 port emits a
# telegram every second, but the meter only refreshes the actual figures every
# ~10s. So instead of polling the submeter on a fixed interval and hoping the
# samples line up, the 1s interval below watches for the moment the P1 numbers
# actually change and polls the SDM72 right then. The Modbus round-trip at 9600
# baud is ~30ms, so both samples describe the same instant and House Load below
# is a real subtraction instead of two readings up to 10s apart.
#
# Pin choice (ESP32-C3 SuperMini): the P1 line must stay off the strapping pins
# (GPIO2/8/9). Its external pull-up holds it high at idle, which would be the
# right level, but the meter sends a telegram every second - a reset landing
# mid-telegram samples a random bit and picks the wrong boot mode. GPIO21 is
# deliberately left unused: the ROM bootloader prints its banner there on every
# reset, so keeping RS485 TX off it means no boot garbage on the Modbus bus.
# Logging runs over USB-Serial/JTAG, so both hardware UARTs stay free.
# P1 sits on GPIO3 to suit the wiring; GPIO20 would have been UART0's IO_MUX RX
# pin, but routing through the GPIO matrix instead costs nothing at 115200 baud.
#
# ---------------------------------------------------------------------------
# What each reading is worth. Energy is the measurement that matters here and is
# almost entirely factual; power is the nice-to-have.
#
#   MEASURED - straight out of a meter register, no arithmetic
#     Grid Voltage/Current/Power L1..L3, Gas Consumed, Grid Import, Grid Export
#       from the P1 telegram; the meter reports current and voltage as whole
#       units, which is why power factor and apparent power are not derived here
#     <meter> Power L1..L3       one Modbus read per meter per second
#
#   DERIVED, but from simultaneous measured values - as good as measured
#     <meter> Power              L1+L2+L3 out of a single register read, so all
#                                three samples are from the same instant
#     <meter> Energy             the meter's own Import minus Export counters,
#                                both out of a single register read
#     Grid Power/Consumed        P1 import minus export, same telegram
#     House Energy               Grid Consumed + PV Energy, both meter counters
#
#   RECONSTRUCTED, anchored once a minute - trend is sound, split is an estimate
#     <meter> Energy L1..L3      the SDM72D-M has no per-phase energy register.
#                                Power is integrated every second and the running
#                                sum is pulled back onto the meter's own total
#                                every 60s, so error cannot accumulate - but which
#                                phase a short load landed on remains a guess.
#
#   INDICATIVE - limited by its slowest input
#     House Load                 PV + grid. The P1 only refreshes every ~10s, so
#                                this is a 10s-resolution figure no matter how
#                                fast PV is sampled. Build automations on House
#                                Energy, not on this.
#
# Everything here is NET (import - export), deliberately. The obvious register for
# a meter total, 0x0156, is throughput (import + export) - confirmed on the meter:
# 10996.052 + 23.143 = 11019.195, exactly its own reading, and over a full night it
# ROSE 0.211 kWh while PV power was negative. Throughput books the inverters'
# overnight draw as production, which had PV Energy 46.3 kWh too high and climbing.
#
# Net also happens to be precisely the time-integral of signed power, which is what
# the per-phase reconstruction integrates. Anchoring on throughput made those two
# disagree in sign, so every nightly correction was twice the real energy. They now
# describe the same quantity and the corrections stay small.
#
# Consequence for Home Assistant: every energy sensor here is `total`, never
# `total_increasing` - a net counter legitimately falls. The only total_increasing
# sensors left are the P1's own Grid Import, Grid Export and Gas, which are
# one-directional by construction.
# ---------------------------------------------------------------------------

# First some basic configuration
#--------------------------------------------
substitutions:
  device_id: meter-hub
  build_root: !secret build_root
  friendly_name: Meter Hub

packages:
  wifi: !include ../wifi.yaml
  version: !include ../version.yaml

esphome:
  name: ${device_id}
  build_path: ${build_root}/${device_id}
  friendly_name: ${friendly_name}
  project:
    name: 'EcoGrid.SmartMeter Hub (P1 + SDM72)'
    version: ${version}

# using an ESP32-C3 SuperMini
esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# restore_value globals below (PV energy counters) need a real write interval
preferences:
  flash_write_interval: 15min

# On the C3 the logger defaults to USB_SERIAL_JTAG, so logs go over the native
# USB port and both hardware UARTs stay free - no baud_rate: 0 needed here.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    uart: WARN
    sensor: WARN
    modbus_controller.sensor: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

# mDNS expliciet aan laten
mdns:
  disabled: false

# Enable web server for debugging and control
web_server:
    port: 80
    version: 3

external_components:
  - source: github://Pluimvee/esphome-dsmr
    refresh: never

# and now we are adding the functionality of this device
#--------------------------------------------

# onboard blue LED (GPIO8, active low): lit = something is wrong, dark = healthy.
# The separate red power LED stays on, so "dark" is distinguishable from "dead".
status_led:
  pin:
    number: GPIO8
    inverted: true

# WiFi in a meterkast is the known weak spot of this board - keep counting drops.
# power_save_mode overrides the `none` from ../wifi.yaml for this device only:
# this board idles around 60 C and the radio, not the CPU, is what heats it.
# A meter that ships a sample every 10s does not need the modem awake between
# them.
wifi:
  power_save_mode: light
  on_disconnect:
    then:
      - lambda: id(wifi_drops) += 1;

uart:
  - id: uart_p1
    rx_pin:
      number: GPIO3
      inverted: true
      # The P1 data line is open collector: the meter can only pull it to GND,
      # never drive it high, so it needs a pull-up to work at all. This internal
      # one (~45k) is weak next to the usual external 1k-10k - keep the external
      # resistor; this only keeps the pin defined when no meter is attached.
      mode:
        input: true
        pullup: true
    baud_rate: 115200
    rx_buffer_size: 3000   # iets ruimer dan 1 frame

  - id: uart_rs485
    # not inverted, so idle is HIGH here; same reasoning as above
    rx_pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
    tx_pin: GPIO6
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

modbus:
  - id: modbus1
    uart_id: uart_rs485
    # ESPHome defaults to 600ms turnaround, which caps a full sweep at ~6s. Three
    # power transactions per second need ~26ms of transmission each, leaving ~280ms
    # of budget per transaction - 200ms fits with room to spare. VERIFY against the
    # real bus: an auto-direction RS485 module needs time to flip, and too short a
    # turnaround shows up as CRC errors and timeouts in the log, not as wrong values.
    turnaround_time: 200ms
    send_wait_time: 500ms   # a dead meter must not stall the next second's poll for 2s

# Each meter polls on its own 1s clock, decoupled from the P1. Only the phase
# power range is read every second (3 transactions); the energy register carries
# skip_updates: 59 so it lands once a minute. House Load is the one value that
# still needs both sources aligned, and it is published from the grid side below -
# with power sampled every second, the PV term is at most 1s old when it fires.
modbus_controller:
  - id: sdm72_pv
    address: 1              # SDM72D-M default Modbus address
    modbus_id: modbus1
    update_interval: 1s
    setup_priority: -10

  - id: sdm72_kitchen
    address: 2
    modbus_id: modbus1
    update_interval: 1s
    setup_priority: -10

  - id: sdm72_living
    address: 3
    modbus_id: modbus1
    update_interval: 1s
    setup_priority: -10

globals:
  - id: wifi_drops
    type: int
    restore_value: false
    initial_value: "0"

  # last net grid power we polled the PV meter on - used to detect a P1 refresh
  - id: last_p1_net
    type: float
    restore_value: false
    initial_value: "NAN"

  # Per-phase energy reconstruction for all three SDM72 meters. The SDM72D-M has
  # no per-phase energy registers, so power is integrated locally every second
  # and re-anchored to each meter's own Total Energy whenever that register
  # ticks: the gap between our running sum and the meter's real delta is
  # distributed over the phases proportional to the MAGNITUDE of their share
  # (see the reconcile lambdas for why signed shares blow up).
  #
  # Index layout, three phases per meter:
  #   0-2 = PV L1..L3    3-5 = Kitchen L1..L3    6-8 = Living L1..L3
  #
  # One array rather than nine separate globals, deliberately: NVS stores this as
  # a single blob, so a sync writes one entry instead of nine.
  - id: integ
    type: float[9]
    initial_value: "{0,0,0,0,0,0,0,0,0}"

  # Renamed from energy_kwh on 2026-09-23 to force a fresh NVS key: the signed-
  # share bug had written +-44 kWh of nonsense into the PV phases, and a code fix
  # cannot unpick stored garbage. The counters restart from zero here.
  - id: phase_kwh
    type: float[9]
    restore_value: true
    initial_value: "{0,0,0,0,0,0,0,0,0}"

  # NOT restored, deliberately. After an unclean reboot this comes back as NAN
  # and the next Total Energy reading simply re-baselines, instead of reconciling
  # a fresh meter delta against a counter that is up to flash_write_interval old.
  - id: prev_total
    type: float[3]
    initial_value: "{NAN, NAN, NAN}"

  # Latest raw phase power, same index layout. The published sensors are throttled
  # to 5s for Home Assistant's sake, and a throttled publish does not update
  # .state - so anything needing a fresh value (the totals, House Load) reads here.
  - id: phase_w
    type: float[9]
    restore_value: false
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}"

interval:
  - interval: 1s
    then:
      - lambda: |-
          // --- House Load: the one value that needs both sources aligned ---
          // Published from the grid side, because that is the slow one: the P1 only
          // refreshes its figures every ~10s, while PV is sampled every second. So
          // firing on a grid change pairs a fresh P1 value with a PV term at most 1s
          // old. Doing it the other way round would pair fresh PV with 10s-old grid.
          const float imp = id(power_import).state;
          const float expo = id(power_export).state;
          const float a = id(phase_w)[0], b = id(phase_w)[1], c = id(phase_w)[2];

          static bool was_valid = false;
          static uint8_t since_publish = 0;
          since_publish++;

          if (isnan(imp) || isnan(expo) || isnan(a) || isnan(b) || isnan(c)) {
            // Undefined without both sources - say so rather than hold a stale number
            if (was_valid) {
              id(house_load).publish_state(NAN);
              was_valid = false;
            }
          } else {
            const float net = imp - expo;
            // the 15s fallback covers a perfectly constant load, where the P1 value
            // never changes and we would otherwise stop publishing entirely
            if (net != id(last_p1_net) || since_publish >= 15) {
              id(last_p1_net) = net;
              since_publish = 0;
              was_valid = true;
              id(house_load).publish_state(a + b + c + net);
            }
          }

p1_dsmr:
  uart_id: uart_p1
  update_interval: 1s
  obis_validity: 10s
  sensors:
    # gas consumption
    - obis: "0-1:24.2.1"
      name: "Gas Consumed"
      unit_of_measurement: "m³"
      device_class: gas
      state_class: total_increasing
      accuracy_decimals: 3
      icon: "mdi:meter-gas"

    # hidden sensors for power calculations
    - id: power_import
      obis: "1-0:1.7.0"
      name: "Power Import"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_export
      obis: "1-0:2.7.0"
      name: "Power Export"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true

    # internal power sensors per phase
    - id: power_l1_import
      obis: "1-0:21.7.0"
      name: "Power L1 Import"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_l1_export
      obis: "1-0:22.7.0"
      name: "Power L1 Export"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_l2_import
      obis: "1-0:41.7.0"
      name: "Power L2 Import"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_l2_export
      obis: "1-0:42.7.0"
      name: "Power L2 Export"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_l3_import
      obis: "1-0:61.7.0"
      name: "Power L3 Import"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true
    - id: power_l3_export
      obis: "1-0:62.7.0"
      name: "Power L3 Export"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      internal: true

    # internal energy sensors per tariff
    - id: energy_import_t1
      obis: "1-0:1.8.1"
      name: "Energy Import T1"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      internal: true
    - id: energy_import_t2
      obis: "1-0:1.8.2"
      name: "Energy Import T2"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      internal: true
    - id: energy_export_t1
      obis: "1-0:2.8.1"
      name: "Energy Export T1"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      internal: true
    - id: energy_export_t2
      obis: "1-0:2.8.2"
      name: "Energy Export T2"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      internal: true

    # published voltage sensors per phase
    - id: voltage_l1
      obis: "1-0:32.7.0"
      name: "Grid Voltage L1"
      icon: "mdi:sine-wave"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - delta: 0.1
    - id: voltage_l2
      obis: "1-0:52.7.0"
      name: "Grid Voltage L2"
      icon: "mdi:sine-wave"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - delta: 0.1
    - id: voltage_l3
      obis: "1-0:72.7.0"
      name: "Grid Voltage L3"
      icon: "mdi:sine-wave"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - delta: 0.1

    # published current sensors per phase
    - id: current_l1
      obis: "1-0:31.7.0"
      name: "Grid Current L1"
      icon: "mdi:current-ac"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 2
      filters:
        - delta: 0.01
    - id: current_l2
      obis: "1-0:51.7.0"
      name: "Grid Current L2"
      icon: "mdi:current-ac"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 2
      filters:
        - delta: 0.01
    - id: current_l3
      obis: "1-0:71.7.0"
      name: "Grid Current L3"
      icon: "mdi:current-ac"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 2
      filters:
        - delta: 0.01

sensor:
  # -- diagnostics --
  # 10s rather than the usual 60s: reception in the meterkast is the open
  # question for this board, and a slow sensor hides short dips
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    icon: "mdi:wifi"
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    update_interval: 60s

  # this board runs hot - keep an eye on the die temperature
  - platform: internal_temperature
    name: "Internal Temperature"
    icon: "mdi:thermometer"
    update_interval: 30s

  - platform: template
    name: "WiFi Drops"
    icon: "mdi:wifi-off"
    entity_category: diagnostic
    lambda: return id(wifi_drops);
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s

  # -- P1: the power for each phase (import - export) --
  - id: power_l1
    platform: template
    name: "Grid Power L1"
    icon: "mdi:flash"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - delta: 1
    lambda: |-
      if (isnan(id(power_l1_import).state) || isnan(id(power_l1_export).state)) return NAN;
      return id(power_l1_import).state - id(power_l1_export).state;

  - id: power_l2
    platform: template
    name: "Grid Power L2"
    icon: "mdi:flash"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - delta: 1
    lambda: |-
      if (isnan(id(power_l2_import).state) || isnan(id(power_l2_export).state)) return NAN;
      return id(power_l2_import).state - id(power_l2_export).state;

  - id: power_l3
    platform: template
    name: "Grid Power L3"
    icon: "mdi:flash"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - delta: 1
    lambda: |-
      if (isnan(id(power_l3_import).state) || isnan(id(power_l3_export).state)) return NAN;
      return id(power_l3_import).state - id(power_l3_export).state;

  # the total net power (import - export)
  - id: net_power
    platform: template
    name: "Grid Power"
    icon: "mdi:flash"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - delta: 1
    lambda: |-
      if (isnan(id(power_import).state) || isnan(id(power_export).state)) return NAN;
      return id(power_import).state - id(power_export).state;

  # the total current
  - id: current_total
    platform: template
    name: "Grid Current"
    icon: "mdi:current-ac"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      - delta: 0.01
    lambda: |-
      float currents[3];
      currents[0] = id(current_l1).state;
      currents[1] = id(current_l2).state;
      currents[2] = id(current_l3).state;
      float total = 0.0f;
      bool has = false;
      for (int i = 0; i < 3; i++) {
        if (!isnan(currents[i])) { total += currents[i]; has = true; }
      }
      return has ? total : NAN;

  # the total net electricity (import - export)
  - platform: template
    name: "Grid Consumed"
    id: grid_consumed
    icon: "mdi:counter"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - delta: 0.01
    lambda: |-
      float value = 0.0;
      bool has_data = false;
      if (!isnan(id(energy_import_t1).state)) { value += id(energy_import_t1).state; has_data = true; }
      if (!isnan(id(energy_import_t2).state)) { value += id(energy_import_t2).state; has_data = true; }
      if (!isnan(id(energy_export_t1).state)) { value -= id(energy_export_t1).state; has_data = true; }
      if (!isnan(id(energy_export_t2).state)) { value -= id(energy_export_t2).state; has_data = true; }
      return has_data ? value : NAN;

  - platform: template
    name: "Grid Import"
    icon: "mdi:counter"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - delta: 0.01
    lambda: |-
      float value = 0.0;
      bool has_data = false;
      if (!isnan(id(energy_import_t1).state)) { value += id(energy_import_t1).state; has_data = true; }
      if (!isnan(id(energy_import_t2).state)) { value += id(energy_import_t2).state; has_data = true; }
      return has_data ? value : NAN;

  - platform: template
    name: "Grid Export"
    icon: "mdi:counter"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - delta: 0.01
    lambda: |-
      float value = 0.0;
      bool has_data = false;
      if (!isnan(id(energy_export_t1).state)) { value += id(energy_export_t1).state; has_data = true; }
      if (!isnan(id(energy_export_t2).state)) { value += id(energy_export_t2).state; has_data = true; }
      return has_data ? value : NAN;

  # -- PV submeter (SDM72D-M on Modbus address 1) --
  # Only the contiguous L1..L3 power range is read each second. The meter's own
  # Total Power register (0x0034) is deliberately NOT read: it equals L1+L2+L3,
  # and leaving it out halves the transactions this bus carries every second.
  - platform: modbus_controller
    modbus_controller_id: sdm72_pv
    name: "PV Power L1"
    id: pv_power_l1
    register_type: read
    address: 0x000C
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle: 5s          # governs Home Assistant only, never the integration
    on_raw_value:
      then:
        - lambda: |-
            // Coulomb counting runs on the RAW value, so it sees every 1s read even
            // though the filter above only lets one through to HA every 5s.
            // dt is measured rather than assumed: a cycle that runs late (the once-a-
            // minute energy sweep makes one) then costs no accuracy at all.
            static uint32_t last_ms = 0;
            const uint32_t now = millis();
            if (!isnan(x)) {
              id(phase_w)[0] = x;
              if (last_ms != 0) {
                const float dt = (now - last_ms) * 0.001f;
                if (dt > 0.0f && dt < 10.0f) {
                  id(integ)[0] += x * dt;                  // W.s
                  id(phase_kwh)[0] += x * dt / 3600000.0f;
                }
              }
              last_ms = now;
            }

  - platform: modbus_controller
    modbus_controller_id: sdm72_pv
    name: "PV Power L2"
    id: pv_power_l2
    register_type: read
    address: 0x000E
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle: 5s          # governs Home Assistant only, never the integration
    on_raw_value:
      then:
        - lambda: |-
            // Coulomb counting runs on the RAW value, so it sees every 1s read even
            // though the filter above only lets one through to HA every 5s.
            // dt is measured rather than assumed: a cycle that runs late (the once-a-
            // minute energy sweep makes one) then costs no accuracy at all.
            static uint32_t last_ms = 0;
            const uint32_t now = millis();
            if (!isnan(x)) {
              id(phase_w)[1] = x;

  # -- the payoff of merging both sources onto one controller --
  # Published from PV Power's on_value, never on its own schedule. That fires on
  # every Modbus read, not only when the value changes: modbus_controller calls
  # publish_state() unconditionally and publish_state() always runs the callback.
  # So a perfectly steady PV output still refreshes this.
  # The one way to break that is adding a filter (delta, throttle, ...) to PV
  # Power - a suppressed publish silently stops House Load too.
  - platform: template
    name: "House Load"
    id: house_load
    icon: "mdi:home-lightning-bolt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # The cumulative counterpart of House Load. Grid Consumed is already net
  # (import - export), so adding PV gives everything the house drew, whatever
  # its source. Both counters move slowly, so this runs on its own 60s schedule
  # rather than the Modbus sync - energy needs no sub-second alignment.
  #
  # state_class is `total`, not `total_increasing`: Grid Consumed itself falls
  # whenever export runs ahead of import, and a total_increasing sensor would
  # read such a dip as a counter reset and book a huge phantom delta.
  - platform: template
    name: "House Energy"
    id: house_energy
    icon: "mdi:home-lightning-bolt"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - delta: 0.01
    lambda: |-
      if (isnan(id(grid_consumed).state) || isnan(id(pv_energy_total).state)) return NAN;
      return id(grid_consumed).state + id(pv_energy_total).state;

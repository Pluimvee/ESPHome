  - platform: modbus_controller
    modbus_controller_id: sdm72_kitchen
    name: "Kitchen Energy"
    id: kitchen_energy_total
    register_type: read
    address: 0x0156
    value_type: FP32
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    skip_updates: 9
    on_value:
      then:
        - lambda: |-
            // reconcile Kitchen (meter 1, phases 3-5) against its own Total Energy
            const int m = 1, base = 3;
            if (isnan(id(prev_total)[m])) {
              id(prev_total)[m] = x;
              return;
            }
            const float meter_delta = x - id(prev_total)[m];
            id(prev_total)[m] = x;
            if (meter_delta <= 0.0f) return;

            float sum = 0.0f;
            for (int i = 0; i < 3; i++) sum += id(integ)[base + i];
            if (sum <= 0.0f) return;

            const float error = meter_delta - (sum / 3600000.0f);
            for (int i = 0; i < 3; i++) {
              id(energy_kwh)[base + i] += error * (id(integ)[base + i] / sum);
              id(integ)[base + i] = 0.0f;
            }


  # Ground truth for the split below, read once a minute (skip_updates: 59 on a 1s
  # controller). Import and Export sit adjacent, so these two are ONE 4-register
  # command - the same single transaction the old 0x0156 read cost.
  #
  # NET (import - export), not 0x0156. That register is throughput (import +
  # export), confirmed on this meter: 10996.052 + 23.143 = 11019.195, exactly its
  # own reading. Throughput books the inverters' overnight draw as production -
  # 46.3 kWh of overstatement on PV and growing - and, worse, disagrees in sign
  # with the signed power we integrate, which made every nightly correction twice
  # the real energy. Net is precisely the time-integral of signed power, so anchor
  # and integration finally describe the same quantity.
  #
  # Both halves stay internal; the published figure is their difference.
  - platform: modbus_controller
    modbus_controller_id: sdm72_living
    id: living_energy_import
    internal: true
    register_type: read
    address: 0x0048
    value_type: FP32
    accuracy_decimals: 3
    skip_updates: 59

  - platform: modbus_controller
    modbus_controller_id: sdm72_living
    id: living_energy_export
    internal: true
    register_type: read
    address: 0x004A
    value_type: FP32
    accuracy_decimals: 3
    skip_updates: 59
    on_value:
      then:
        - lambda: |-
            // Export is the second sensor in the block, so Import is already parsed
            // by the time this fires. Re-anchor Living (meter 2, phases 6-8) to the
            // meter's net.
            //
            // The per-second lambdas have ALREADY booked each phase's own measurement
            // into phase_kwh. What happens here is only the small residual between that
            // running sum and what the meter itself reports, spread over the phases by
            // SIGNED share - so a phase that was consuming while another produced keeps
            // its own direction instead of being dragged along with the correction.
            // The three shares sum to exactly 1, so the phases land on meter_delta
            // together. (Signed and magnitude shares are identical whenever all three
            // phases carry the same sign; they only diverge in mixed-sign windows, which
            // on a PV meter is dawn and dusk with one string producing and another still
            // drawing - exactly where the old magnitude split biased the dark phase up.)
            const int m = 2, base = 6;
            const float imp = id(living_energy_import).state;
            if (isnan(imp) || isnan(x)) return;
            const float net = imp - x;               // x is Export
            id(living_energy_total).publish_state(net);

            if (isnan(id(prev_total)[m])) {
              id(prev_total)[m] = net;               // first reading only baselines
              return;
            }

            // Resolution floor: net is a difference of two FP32s near 11000 kWh, so its
            // own quantisation is ~0.001 kWh while a real register tick is 0.01. Below
            // this the "delta" is float noise - skip the whole reconcile and leave
            // prev_total and integ standing, so the next cycle measures the full period.
            constexpr float MIN_DELTA = 0.005f;      // kWh
            // How far the signed split may amplify. sum_abs/|sum| is exactly that factor:
            // phases that nearly cancel drive |sum| towards zero and blow the shares up
            // into huge equal-and-opposite corrections - this is what produced +-44 kWh
            // on the PV phases. sum == 0 is only the limit case, so bound the ratio
            // rather than testing for zero alone.
            constexpr float MAX_AMP = 4.0f;

            const float meter_delta = net - id(prev_total)[m];
            if (fabsf(meter_delta) > 500.0f) {
              // A counter reset reads as a five-figure jump; no submeter accumulates
              // 500 kWh between two reconciles. Re-baseline, never correct.
              id(prev_total)[m] = net;
              for (int i = 0; i < 3; i++) id(integ)[base + i] = 0.0f;
              return;
            }
            if (fabsf(meter_delta) < MIN_DELTA) return;   // carry forward, nothing consumed

            float sum = 0.0f, sum_abs = 0.0f;
            for (int i = 0; i < 3; i++) {
              sum += id(integ)[base + i];
              sum_abs += fabsf(id(integ)[base + i]);
            }
            const float sum_kwh = sum / 3600000.0f;

            if (sum_kwh == 0.0f || (sum_kwh > 0.0f) != (meter_delta > 0.0f) ||
                sum_abs > MAX_AMP * fabsf(sum)) {
              // Either the local count points the other way than the meter (a missed
              // update after a reboot or a Modbus gap), or the phases nearly cancel and
              // the split would amplify wildly. Neither can be attributed sensibly:
              // drop the correction and re-baseline rather than guess.
              ESP_LOGW("recon", "meter=%d delta=%.4f sum=%.6f amp=%.1f - skipped",
                       m, meter_delta, sum_kwh, sum_abs / (fabsf(sum) + 1e-9f));
              id(prev_total)[m] = net;
              for (int i = 0; i < 3; i++) id(integ)[base + i] = 0.0f;
              return;
            }

            id(prev_total)[m] = net;
            const float error = meter_delta - sum_kwh;
            for (int i = 0; i < 3; i++) {
              id(phase_kwh)[base + i] += error * (id(integ)[base + i] / sum);
              id(integ)[base + i] = 0.0f;
            }
            ESP_LOGD("recon", "meter=%d delta=%.4f sum=%.6f error=%.6f",
                     m, meter_delta, sum_kwh, error);

  # Net energy, published from the reconcile above so all four counters of this
  # meter land together. `total`, not `total_increasing`: a net counter falls
  # whenever the reverse direction runs ahead - every night, on PV.
  - platform: template
    name: "Living Energy"
    id: living_energy_total
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    update_interval: never


# Copyright (c) 2026 Pluimvee
# SDM72D-M energy meter reader via Modbus RTU
#
# This meter has no per-phase energy registers. Re-verified on the hardware
# 2026-09-23: all three families from the SDM630 manual - per-phase total
# (0x0166-0x016a), import (0x015a-0x015e) and export (0x0160-0x0164) - return
# exactly 0.000. The meter answers those addresses without an exception, so the
# registers exist in the map but are simply never populated on this model.
#
# So per-phase kWh is reconstructed locally: active power per phase is integrated
# every second into energy_lX_kwh, so the values move in real time. The meter's own
# counter only steps in ~0.01 kWh increments, so it cannot be the primary source -
# instead, whenever it moves, the gap between our running sum and the meter's real
# delta is distributed across the phases. That keeps the long-term total anchored
# to ground truth without needing a resolvable meter step before anything shows.
#
# Three things about that anchoring are easy to get wrong, and all three were:
#
# 1. NET, not throughput. The obvious total register (0x0156) accumulates import +
#    export as positive magnitude - measured on the meter: 10996.052 + 23.143 =
#    11019.195, exactly its own reading. It therefore RISES at night while a PV
#    inverter draws, booking that draw as production. Import (0x0048) minus Export
#    (0x004A) is the real net, and it is also precisely the time-integral of the
#    signed power we integrate. Anchoring on throughput made those two disagree in
#    sign, so every nightly correction was twice the real energy.
#
# 2. Split by SIGNED share, but bound how far it can amplify. Each phase's own
#    measurement is already booked per second; the reconcile only spreads the small
#    residual, and it must keep each phase's direction - a phase consuming while
#    another produces should be corrected downwards, not dragged along. Signed and
#    magnitude shares are identical whenever all three phases carry the same sign;
#    they only differ in mixed-sign windows, and there the magnitude split biases
#    the consuming phase upwards. The catch is that integ[i]/sum explodes when the
#    phases nearly cancel - that is what produced +-44 kWh swings - so the ratio
#    sum_abs/|sum|, which is exactly that amplification, is capped.
#
# 3. Advance prev_total only when the correction is actually applied. Bailing out
#    after advancing it consumes a real meter delta and drops it for good, which
#    desynchronises the phase sum from the meter permanently.

substitutions:
  device_id: sdm72d-m
  build_root: !secret build_root
  friendly_name: SDM72D-M Energy Meter

packages:
  wifi: !include ../wifi.yaml
  version: !include ../version.yaml

esphome:
  name: ${device_id}
  build_path: ${build_root}/${device_id}
  friendly_name: ${friendly_name}
  project:
    name: 'EcoGrid.SDM72D-M Reader'
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 15min

logger:
  level: INFO
  baud_rate: 0
  logs:
    uart: WARN
    sensor: WARN
    modbus_controller.sensor: WARN

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

mdns:
  disabled: false

web_server:
  port: 80
  version: 3

uart:
  - id: uart_rs485
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

modbus:
  - id: modbus1
    uart_id: uart_rs485

modbus_controller:
  - id: sdm72dm
    address: 1          # SDM72D-M default Modbus address
    modbus_id: modbus1
    update_interval: 1s  # base tick - power reads happen every tick, others are skipped down below
    setup_priority: -10

globals:
  - id: integ_l1
    type: float
    initial_value: "0"
  - id: integ_l2
    type: float
    initial_value: "0"
  - id: integ_l3
    type: float
    initial_value: "0"
  # NOTE: prev_total_energy is intentionally NOT restore_value. On an unclean
  # reboot it resets to NAN, so the next Total Energy reading just re-baselines
  # instead of reconciling - any meter delta that accrued since the last flash
  # sync (up to flash_write_interval old) is silently dropped from the l1/l2/l3
  # split forever (energy_lX_kwh itself also rolls back that same window, since
  # it's restore_value on the same sync). If that permanent gap ever matters,
  # make this restore_value: true too - all restore_value globals are flushed
  # together in one sync() (see esp32/preferences.cpp), so it would then
  # reconcile the whole missed period in one go, using whatever power ratio is
  # available in the first few seconds after boot (a rough guess for that one
  # catch-up event, but the running total would no longer permanently drift).
  - id: prev_total_energy
    type: float
    initial_value: "NAN"
  - id: energy_l1_kwh
    type: float
    restore_value: true
    initial_value: "0"
  - id: energy_l2_kwh
    type: float
    restore_value: true
    initial_value: "0"
  - id: energy_l3_kwh
    type: float
    restore_value: true
    initial_value: "0"

interval:
  - interval: 1s
    then:
      - lambda: |-
          const float p1 = id(power_l1).state;
          const float p2 = id(power_l2).state;
          const float p3 = id(power_l3).state;
          // direct integration (W sample each second -> kWh) so the values move
          // in real time; Total Energy below only corrects the accumulated drift
          if (!isnan(p1)) { id(integ_l1) += p1; id(energy_l1_kwh) += p1 / 3600000.0f; }
          if (!isnan(p2)) { id(integ_l2) += p2; id(energy_l2_kwh) += p2 / 3600000.0f; }
          if (!isnan(p3)) { id(integ_l3) += p3; id(energy_l3_kwh) += p3 / 3600000.0f; }

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    icon: "mdi:wifi"
    update_interval: 60s

  # --- Voltage per phase (0x0000-0x0004), read once every 10 ticks (~10s) ---
  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Voltage L1"
    id: voltage_l1
    register_type: read
    address: 0x0000
    value_type: FP32
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: 9

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Voltage L2"
    id: voltage_l2
    register_type: read
    address: 0x0002
    value_type: FP32
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: 9

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Voltage L3"
    id: voltage_l3
    register_type: read
    address: 0x0004
    value_type: FP32
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: 9

  # --- Active power per phase + total (0x000C-0x0010, 0x0034), every tick (~1s) ---
  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Active Power L1"
    id: power_l1
    register_type: read
    address: 0x000C
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Active Power L2"
    id: power_l2
    register_type: read
    address: 0x000E
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Active Power L3"
    id: power_l3
    register_type: read
    address: 0x0010
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    name: "Total Active Power"
    id: power_total
    register_type: read
    address: 0x0034
    value_type: FP32
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # --- Net energy (Import 0x0048 - Export 0x004A), ground truth below, ~10s ---
  # The two registers are adjacent, so they read as ONE 4-register command - the
  # same single transaction the old 0x0156 read cost. Both stay internal; what is
  # published is their difference. See the header for why net rather than 0x0156.
  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    id: energy_import
    internal: true
    register_type: read
    address: 0x0048
    value_type: FP32
    accuracy_decimals: 3
    skip_updates: 9

  - platform: modbus_controller
    modbus_controller_id: sdm72dm
    id: energy_export
    internal: true
    register_type: read
    address: 0x004A
    value_type: FP32
    accuracy_decimals: 3
    skip_updates: 9
    on_value:
      then:
        - lambda: |-
            // Export is the second sensor in the block, so Import is already parsed
            // by the time this fires.
            //
            // The per-second interval has ALREADY booked each phase's own measurement
            // into energy_lX_kwh. What happens here is only the small residual between
            // that running sum and what the meter itself reports, spread over the
            // phases by SIGNED share so each keeps its own direction. The three shares
            // sum to exactly 1, so the phases land on meter_delta together.
            const float imp = id(energy_import).state;
            if (isnan(imp) || isnan(x)) return;
            const float net = imp - x;               // x is Export
            id(energy_total).publish_state(net);

            if (isnan(id(prev_total_energy))) {
              id(prev_total_energy) = net;           // first reading only baselines
              return;
            }

            // Resolution floor: net is a difference of two FP32s in the thousands, so
            // its own quantisation is ~0.001 kWh while a real register tick is 0.01.
            // Below this the "delta" is float noise - skip the reconcile entirely and
            // leave prev_total_energy and integ_lX standing, so the next cycle measures
            // the full period instead of losing it.
            constexpr float MIN_DELTA = 0.005f;      // kWh
            // How far the signed split may amplify - see header note 2.
            constexpr float MAX_AMP = 4.0f;

            const float meter_delta = net - id(prev_total_energy);
            if (fabsf(meter_delta) > 500.0f) {
              // A counter reset reads as a five-figure jump; no submeter accumulates
              // 500 kWh between two reconciles. Re-baseline, never correct.
              id(prev_total_energy) = net;
              id(integ_l1) = 0.0f;
              id(integ_l2) = 0.0f;
              id(integ_l3) = 0.0f;
              return;
            }
            if (fabsf(meter_delta) < MIN_DELTA) return;   // carry forward

            const float sum = id(integ_l1) + id(integ_l2) + id(integ_l3);
            const float sum_abs = fabsf(id(integ_l1)) + fabsf(id(integ_l2)) + fabsf(id(integ_l3));
            const float sum_kwh = sum / 3600000.0f;

            if (sum_kwh == 0.0f || (sum_kwh > 0.0f) != (meter_delta > 0.0f) ||
                sum_abs > MAX_AMP * fabsf(sum)) {
              // Either the local count points the other way than the meter (a missed
              // update after a reboot or a Modbus gap), or the phases nearly cancel and
              // the split would amplify wildly. Neither can be attributed sensibly:
              // drop the correction and re-baseline rather than guess.
              ESP_LOGW("recon", "delta=%.4f sum=%.6f amp=%.1f - skipped",
                       meter_delta, sum_kwh, sum_abs / (fabsf(sum) + 1e-9f));
              id(prev_total_energy) = net;
              id(integ_l1) = 0.0f;
              id(integ_l2) = 0.0f;
              id(integ_l3) = 0.0f;
              return;
            }

            id(prev_total_energy) = net;
            const float error = meter_delta - sum_kwh;
            id(energy_l1_kwh) += error * (id(integ_l1) / sum);
            id(energy_l2_kwh) += error * (id(integ_l2) / sum);
            id(energy_l3_kwh) += error * (id(integ_l3) / sum);
            id(integ_l1) = 0.0f;
            id(integ_l2) = 0.0f;
            id(integ_l3) = 0.0f;
            ESP_LOGD("recon", "delta=%.4f sum=%.6f error=%.6f", meter_delta, sum_kwh, error);

  # Net total, published from the reconcile above so it lands with the phases.
  # `total`, not `total_increasing`: a net counter falls whenever the reverse
  # direction runs ahead - every night, on a PV meter.
  - platform: template
    name: "Total Energy"
    id: energy_total
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    update_interval: never

  # --- Locally reconstructed per-phase energy, corrected against Total Energy above ---
  - platform: template
    name: "Energy L1"
    id: energy_l1_sensor
    lambda: return id(energy_l1_kwh);
    unit_of_measurement: "kWh"
    device_class: energy
    # `total`, not `total_increasing`: a reconstructed counter legitimately dips -
    # negative power subtracts live, and the reconciliation applies a negative
    # correction whenever the integration ran ahead of the meter. total_increasing
    # tolerates only a drop below 10% and reads anything larger as a counter reset,
    # booking it as phantom energy.
    state_class: total
    accuracy_decimals: 3
    update_interval: 10s

  - platform: template
    name: "Energy L2"
    id: energy_l2_sensor
    lambda: return id(energy_l2_kwh);
    unit_of_measurement: "kWh"
    device_class: energy
    # `total`, not `total_increasing`: a reconstructed counter legitimately dips -
    # negative power subtracts live, and the reconciliation applies a negative
    # correction whenever the integration ran ahead of the meter. total_increasing
    # tolerates only a drop below 10% and reads anything larger as a counter reset,
    # booking it as phantom energy.
    state_class: total
    accuracy_decimals: 3
    update_interval: 10s

  - platform: template
    name: "Energy L3"
    id: energy_l3_sensor
    lambda: return id(energy_l3_kwh);
    unit_of_measurement: "kWh"
    device_class: energy
    # `total`, not `total_increasing`: a reconstructed counter legitimately dips -
    # negative power subtracts live, and the reconciliation applies a negative
    # correction whenever the integration ran ahead of the meter. total_increasing
    # tolerates only a drop below 10% and reads anything larger as a counter reset,
    # booking it as phantom energy.
    state_class: total
    accuracy_decimals: 3
    update_interval: 10s
